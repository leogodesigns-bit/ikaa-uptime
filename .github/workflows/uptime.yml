# Ikaa uptime: every 5 minutes, from GitHub (not Railway). WhatsApp after 2 failed checks
# in a row, and again when the site is back. Public repo: Actions minutes are free.
name: uptime
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch: {}
concurrency: uptime
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          ALERT_KIND: site
          SETU_OWNER_ALERT_URL: ${{ vars.SETU_OWNER_ALERT_URL }}
          SETU_SEND_SECRET: ${{ secrets.SETU_SEND_SECRET }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          WA_TEMPLATE: ${{ vars.WA_TEMPLATE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 uptime.py
      - name: Save state when it changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "ikaa-uptime"; git config user.email "uptime@users.noreply.github.com"
            git commit -qm "uptime state" state.json && git push -q
          fi
